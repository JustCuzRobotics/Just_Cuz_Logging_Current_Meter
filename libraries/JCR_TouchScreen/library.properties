name=JCR_TouchScreen
version=1.0.0
author=Just 'Cuz Robotics
maintainer=Just 'Cuz Robotics <team@justcuzrobotics.com>
sentence=Reliable capacitive touch and fast raw-SPI graphics for ST7796 + FT6336U panels on the RP2040.
paragraph=Fixes the dropped-tap problem these panels are known for: the FT6336U runs in polling mode and is sampled at a fixed cadence from whichever core you choose, with press/release events queued so a slow UI frame can never lose a tap. Includes a resolution- and rotation-agnostic ST7796 driver at 40 MHz, a bitmap text renderer, and a TTF-to-bitmap font generator. Extending to another controller or resolution is a small subclass.
